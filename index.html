<!doctype html>
<html>
    <head>
        <title>GenomeSpy</title>
        <meta charset="UTF-8" />
        <link
            rel="stylesheet"
            type="text/css"
            href="https://cdn.jsdelivr.net/npm/@genome-spy/app@0.79.x/dist/style.css"
        />
    </head>

    <body>
        <script type="module">
            import { embed } from "https://cdn.jsdelivr.net/npm/@genome-spy/app@0.79.x/dist/index.es.js";

            const specUrl = new URLSearchParams(window.location.search).get(
                "spec"
            );
            if (specUrl) {
                embed(document.body, specUrl);
            } else {
                document.body.innerHTML = `
                <p style="color: firebrick">No 'spec' url parameter defined!</p>
                <p>Try the simple <a href="?spec=simple/bar.json">bar plot spec</a>, for example!</p>`;
            }
        </script>
    </body>
</html>
